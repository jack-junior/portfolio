role: Biostatistician, epidemiologist and health data scientist
location: Lomé, Togo
headline: I turn health data into evidence, and evidence into tools people can use.
intro: >-
  I am a biostatistician, epidemiologist and data scientist in Lomé, at the
  National Health Intelligence Unit (UNIS) of Togo's Ministry of Health. My
  research asks how incomplete and imperfect data change the conclusions of
  trials, surveys and prediction models. Alongside it I build software that
  people can run without writing code: a monitoring-and-evaluation workstation,
  data-quality and wearable-data pipelines, open methods resources for
  French-speaking students. I contribute to open-source projects and share what
  I learn in talks.
about: >-
  I trained first as a medical laboratory scientist and spent four and a half years
  in the laboratory of Bè-Kpota Hospital, a public hospital in Lomé, where I ended
  up running the ISO 15189 quality system. I then completed an M.Sc. in
  Biostatistics and Epidemiology at SRM Institute of Science and Technology in
  Chennai, India, with first-class distinction, and worked on research data
  management at the Centre for Chronic Disease Control, a WHO Collaborating Centre
  in New Delhi. After a biostatistics internship at CARESP, I joined the National Health
  Intelligence Unit (UNIS) of the Ministry of Health in November 2026.
