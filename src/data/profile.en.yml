themes:
  - title: Missing outcomes in clinical trials
    text: >-
      In advanced-cancer trials, the patients whose health is declining are often
      the ones who stop filling in quality-of-life questionnaires. My M.Sc. thesis
      modelled these functional-decline trajectories and compared multiple
      imputation (MICE) with inverse-probability-of-censoring weighting (IPCW) for
      training prediction models on the incomplete data. Multiple imputation gave
      better-calibrated models. Delta-adjustment sensitivity analyses test how far
      the conclusions hold when data are missing not at random.
    question: When does a model trained on incomplete trial data remain trustworthy?
  - title: Prediction models that travel
    text: >-
      A model built in one hospital or country is often used somewhere else, where
      other tests are available and other variables go missing. I am interested in
      how missingness itself changes between the place a model is developed and the
      place it is used, and what this does to its performance in low-resource
      settings.
    question: How much performance is lost when the pattern of missing data changes between sites?
  - title: Inequalities in global health outcomes
    text: >-
      With 2024 UNAIDS and World Bank data for 105 countries, I examined how far
      national wealth explains differences in HIV mortality. It explains less than
      half of the variation between countries, several low-income countries do
      better than expected, and men carry a consistent survival disadvantage.
    question: What, beyond income, separates health systems that do better than expected?
  - title: Child health, malaria and vaccination
    text: >-
      As a co-author I have worked on national survey data with complex sampling
      designs: geographic variation in malaria among children under five in Liberia
      (2022 Malaria Indicator Survey) and immunisation gaps between Indian states
      (NFHS-5).
