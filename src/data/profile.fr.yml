headline: Je transforme les données de santé en preuves, et les preuves en outils.
intro: >-
  Je suis biostatisticien, épidémiologiste et data scientist à Lomé, à l'Unité
  nationale d'intelligence sanitaire (UNIS) du ministère de la Santé du Togo. Ma
  recherche porte sur la façon dont les données incomplètes et imparfaites
  modifient les conclusions des essais, des enquêtes et des modèles prédictifs. À
  côté, je construis des logiciels que l'on peut utiliser sans écrire de code : un
  poste de travail de suivi-évaluation, des chaînes de contrôle qualité et de
  traitement de données d'objets connectés, des ressources méthodologiques
  ouvertes pour les étudiants francophones. Je contribue à des projets open source
  et je partage ce que j'apprends lors d'interventions publiques.
about: >-
  J'ai d'abord été formé comme technicien de laboratoire médical et j'ai passé
  quatre ans et demi au laboratoire de l'hôpital de Bè-Kpota, un hôpital public de
  Lomé, où j'ai fini par piloter le système qualité ISO 15189. J'ai ensuite obtenu
  un M.Sc. en biostatistique et épidémiologie au SRM Institute of Science and
  Technology de Chennai, en Inde, avec mention très bien (first-class distinction),
  puis travaillé sur la gestion des données de recherche au Centre for Chronic
  Disease Control, centre collaborateur de l'OMS à New Delhi. Après un stage en
  biostatistique au CARESP, j'ai rejoint en novembre 2026 l'Unité nationale
  d'intelligence sanitaire (UNIS) du ministère de la Santé.
