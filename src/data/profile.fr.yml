themes:
  - title: Les issues manquantes dans les essais cliniques
    text: >-
      Dans les essais en cancérologie avancée, ce sont souvent les patients dont
      l'état se dégrade qui cessent de remplir les questionnaires de qualité de vie.
      Mon mémoire de M.Sc. a modélisé ces trajectoires de déclin fonctionnel et
      comparé l'imputation multiple (MICE) à la pondération par l'inverse de la
      probabilité de censure (IPCW) pour entraîner des modèles prédictifs sur ces
      données incomplètes. L'imputation multiple donne des modèles mieux calibrés.
      Des analyses de sensibilité par ajustement delta testent la solidité des
      conclusions lorsque les données manquent de façon non aléatoire.
    question: Quand un modèle entraîné sur des données d'essai incomplètes reste-t-il fiable ?
  - title: Des modèles prédictifs transposables
    text: >-
      Un modèle construit dans un hôpital ou un pays est souvent utilisé ailleurs, là
      où d'autres examens sont disponibles et où d'autres variables manquent. Je
      m'intéresse à la façon dont la manquance elle-même change entre le lieu où un
      modèle est développé et celui où il est utilisé, et à ce que cela coûte en
      performance dans les contextes à ressources limitées.
    question: Combien de performance perd-on quand le profil des données manquantes change d'un site à l'autre ?
  - title: Les inégalités de santé dans le monde
    text: >-
      Avec les données 2024 d'ONUSIDA et de la Banque mondiale pour 105 pays, j'ai
      examiné dans quelle mesure la richesse nationale explique les écarts de
      mortalité liée au VIH. Elle explique moins de la moitié des différences entre
      pays, plusieurs pays à faible revenu font mieux que prévu, et les hommes
      subissent un désavantage de survie constant.
    question: Au-delà du revenu, qu'est-ce qui distingue les systèmes de santé qui font mieux que prévu ?
  - title: Santé de l'enfant, paludisme et vaccination
    text: >-
      Comme co-auteur, j'ai travaillé sur des enquêtes nationales à plan de sondage
      complexe : variation géographique du paludisme chez les enfants de moins de
      cinq ans au Liberia (Malaria Indicator Survey 2022) et écarts de vaccination
      entre États indiens (NFHS-5).
skills:
