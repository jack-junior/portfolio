    items: Analyse de survie, modèles longitudinaux, modèles linéaires généralisés et multiniveaux, modélisation bayésienne, traitement des données manquantes (imputation multiple, pondération par probabilité inverse, analyses de sensibilité), essais, cohortes et études cas-témoins, recherche sur la mise en œuvre.
  - group: Science des données
    items: Modèles de prédiction clinique et leur validation, apprentissage automatique appliqué à la santé, analyse spatiale et spatio-temporelle, séries temporelles, tableaux de bord et rapports automatisés.
  - group: Données d'enquête et de routine
    items: Enquêtes à plan de sondage complexe (EDS, MICS, MIS), données de surveillance et de routine, contrôle qualité et validation des données.
  - group: Outils
    items: R et R Shiny, Python, Stata, SAS, REDCap, Quarto, Git, React, Firebase.
  - group: Qualité et réglementation
    items: Bonnes pratiques cliniques (NIDA Clinical Trials Network, 2025), management de la qualité au laboratoire ISO 15189.
